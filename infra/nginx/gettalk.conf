# ==============================================================================
# GetTalk Nginx Reverse Proxy Configuration (2 Subdomains)
#   1. Frontend Static SPA : https://app.38-9-47-209.sslip.io
#   2. Backend API & WS    : https://api.38-9-47-209.sslip.io -> http://127.0.0.1:3000
#
# Cara pasang di VPS Ubuntu/Debian:
#   sudo cp infra/nginx/gettalk.conf /etc/nginx/sites-available/gettalk.conf
#   sudo ln -s /etc/nginx/sites-available/gettalk.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.38-9-47-209.sslip.io -d api.38-9-47-209.sslip.io
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ──────────────────────────────────────────────────────────────────────────────
# 1. FRONTEND SUBDOMAIN (app.38-9-47-209.sslip.io)
#    Menyajikan hasil build statis Vite (`frontend/dist`)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.38-9-47-209.sslip.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.38-9-47-209.sslip.io;

    # Sesuaikan dengan lokasi sertifikat SSL (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/app.38-9-47-209.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.38-9-47-209.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Sesuaikan path ke folder hasil `npm run build` frontend di VPS Anda
    root /var/www/GetTalk/frontend/dist;
    index index.html;

    # Security Headers untuk Frontend SPA
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache panjang untuk hashed assets Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Fallback (mengarahkan route client ke index.html)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. BACKEND API & SOCKET.IO SUBDOMAIN (api.38-9-47-209.sslip.io)
#    Reverse Proxy ke Node.js Express + Socket.IO (http://127.0.0.1:3000)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.38-9-47-209.sslip.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.38-9-47-209.sslip.io;

    # Sesuaikan dengan lokasi sertifikat SSL (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/app.38-9-47-209.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.38-9-47-209.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Wajib >= 25MB agar unggahan lampiran terenkripsi (E2EE attachments) tidak ditolak 413 oleh Nginx
    client_max_body_size 30M;

    # Endpoint WebSocket / Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Endpoint REST API & Pre-signed Storage (/api/*, /health)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

