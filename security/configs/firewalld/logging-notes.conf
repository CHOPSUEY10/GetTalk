# ==============================================================================
# GetTalk Security — Firewalld Denied Packet Logging Notes
# Passive observation only — the collector NEVER modifies firewalld policies.
# ==============================================================================
#
# To ensure dropped and rejected connection attempts are emitted to journald/kernel
# with rate-limited protection (avoiding unrestricted packet log flooding), an
# administrator may manually review and set:
#
#   sudo firewall-cmd --get-log-denied
#   sudo firewall-cmd --set-log-denied=unicast
#
# Or configure a rich rule with an explicit rate limit per service/zone:
#   rule family="ipv4" log prefix="FINAL_REJECT: " level="warning" limit value="30/m" reject
#
# The GetTalk Security Firewalld Collector reads kernel/journald entries matching:
#   IN=... OUT=... SRC=<ip> DST=<ip> ... PROTO=<TCP|UDP|ICMP> SPT=<port> DPT=<port>

