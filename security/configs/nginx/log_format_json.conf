# ==============================================================================
# GetTalk Security — Structured JSON Access Log Format for Nginx
# Place in /etc/nginx/conf.d/gettalk-telemetry-log.conf (inside http {} block)
# Never logs request bodies, cookies, or Authorization headers.
# ==============================================================================

log_format gettalk_telemetry_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"request_uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"server_protocol":"$server_protocol"'
    '}';

# Example usage inside server {} blocks:
# access_log /var/log/nginx/access.log gettalk_telemetry_json;
# error_log  /var/log/nginx/error.log warn;

