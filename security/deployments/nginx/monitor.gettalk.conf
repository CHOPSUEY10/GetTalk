# ==============================================================================
# GetTalk Security — Nginx Reverse Proxy Configuration
# Subdomain : monitor.gettalk.example
# Frontend  : /var/www/GetTalk/security/frontend/dist
# Backend   : http://127.0.0.1:4100 (/api/v1)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name monitor.gettalk.example;

    root /var/www/GetTalk/security/frontend/dist;
    index index.html;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    # Server-Sent Events (SSE) Real-Time Stream Endpoint
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:4100/api/v1/stream;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API v1 Endpoints
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4100/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Immutable Hashed Vite Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

